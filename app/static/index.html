<!DOCTYPE html>
<html lang="en" style="overflow-x:hidden;width:100%">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Destillo</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #F6EFE4; --card: #FDFAF4; --ink: #362B22; --ink2: #6B5D4D; --ink3: #9C8D7A;
  --rust: #B5502F; --rust2: #8F3D22; --olive: #7C8A5C; --brick: #A8462E; --blue: #5B8EC9;
  --border: #E6D9C4; --radius: 12px;
  --ff: -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  --ffm: 'SF Mono',ui-monospace,menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;width:100%;overflow-x:hidden;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--ff);font-size:15px;line-height:1.45;
  min-height:100dvh;width:100%;overflow-x:hidden;overflow-y:auto;
  -webkit-font-smoothing:antialiased;
}

/* Nav */
nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:4px;
  padding:0 12px;height:48px;
  background:var(--card);border-bottom:1px solid var(--border);
}
.nav-logo{font-weight:800;font-size:16px;color:var(--rust);margin-right:6px;white-space:nowrap}
.nav-tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
  height:100%;background:none;border:none;
  font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;
  border-bottom:3px solid transparent;min-width:0;transition:color .15s,background .15s;
}
.nav-tab.active{color:var(--rust);border-bottom-color:var(--rust);background:rgba(181,80,47,.06)}

/* Content */
#content{padding:12px;padding-bottom:100px;max-width:600px;margin:0 auto}
.tab{display:none}.tab.active{display:block}

/* Section card */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:10px}

/* Row */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-l{flex:1;min-width:0}
.row-r{flex-shrink:0;display:flex;align-items:center;gap:6px}

/* Form */
.ur{display:flex;gap:0;margin-bottom:10px}
.ui{flex:1;background:var(--bg);border:1.5px solid var(--border);border-right:none;border-radius:8px 0 0 8px;padding:10px 12px;font-size:14px;outline:none;min-height:44px}
.ui:focus{border-color:var(--rust)}
.sb{background:var(--rust);color:#fff;border:none;border-radius:0 8px 8px 0;padding:10px 16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:44px}
.sb:disabled{opacity:.4}
.sel{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;outline:none;min-height:44px;cursor:pointer}
.sel:focus{border-color:var(--rust)}

/* Stats */
.st{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.st-l{color:var(--ink2);word-break:break-word}.st-v{font-family:var(--ffm);font-weight:600}

/* Library items */
.li{
  display:flex;align-items:flex-start;gap:8px;
  padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;
}
.li:last-child{border-bottom:none}
.li-c{flex:1;min-width:0}
.li-t{font-weight:600;font-size:14px;color:var(--ink);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;word-break:break-word}
.li-m{font-family:var(--ffm);font-size:10px;color:var(--ink3);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{font-size:12px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

/* Badge */
.b{
  font-family:var(--ffm);font-size:10px;padding:2px 7px;border-radius:4px;flex-shrink:0;
}
.b-a{background:rgba(91,142,201,.12);color:var(--blue)}
.b-m{background:var(--border);color:var(--ink3)}
.b-d{background:rgba(124,138,92,.12);color:var(--olive)}
.b-e{background:rgba(168,70,46,.12);color:var(--brick)}
.b-q{background:rgba(181,80,47,.12);color:var(--rust)}

/* Tags */
.t{font-family:var(--ffm);font-size:9px;padding:1px 6px;border-radius:3px;background:var(--border);color:var(--ink3)}
.tg{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}

/* Search */
.sc{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.si{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;min-height:44px;min-width:0}
.si:focus{border-color:var(--rust)}
.fs{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;min-height:44px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;min-height:44px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none}
.btn-r{background:var(--rust);color:#fff}
.btn-g{background:var(--border);color:var(--ink2)}
.btn-red{background:rgba(168,70,46,.12);color:var(--brick)}
.btn-b{background:rgba(91,142,201,.12);color:var(--blue)}
.lm{width:100%;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--ink3);font-size:12px;cursor:pointer;margin-top:8px}

/* Dot */
.d{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.d-d{background:var(--olive)}.d-e{background:var(--brick)}.d-q{background:var(--rust);animation:bl 1.8s infinite}
@keyframes bl{50%{opacity:.25}}

/* Settings */
.sr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.sr:last-child{border-bottom:none}
.sl{font-size:14px;color:var(--ink);flex-shrink:0;width:80px}
.sv{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;outline:none;min-height:44px}
.sv:focus{border-color:var(--rust)}

/* Tag cloud */
.tc{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tci{padding:5px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--ink2);cursor:pointer;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tci:active{background:rgba(181,80,47,.12)}

/* Channel */
.ch{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;min-height:44px}
.ch:last-child{border-bottom:none}
.ch-n{flex:1;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-c{font-family:var(--ffm);font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Empty */
.e{text-align:center;padding:32px 16px}
.e-i{font-size:28px;margin-bottom:8px}
.e-t{font-size:17px;font-weight:600;margin-bottom:4px}
.e-s{font-size:13px;color:var(--ink3);word-break:break-word}

/* Toast */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;
  font-size:13px;z-index:999;opacity:0;pointer-events:none;
  transition:opacity .25s;white-space:nowrap;max-width:85vw;text-align:center;
}
.toast.s{opacity:1}

/* Bulk */
#bulk{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 14px;display:none;align-items:center;gap:8px;z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,.12);font-size:12px;
}
#bulk.s{display:flex;flex-wrap:wrap;justify-content:center}
.bc span{color:var(--rust);font-weight:600}
.ba{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:11px;min-height:32px}
.bk{display:none} /* always hidden for now */
.bp{font-size:11px;padding:6px 12px;min-height:32px;background:var(--rust);color:#fff;border:none;border-radius:5px;cursor:pointer}
.bx{font-size:11px;padding:6px 10px;min-height:32px;background:var(--border);border:1px solid var(--border);border-radius:5px;color:var(--ink2);cursor:pointer}

/* Star */
.star{background:none;border:none;font-size:16px;cursor:pointer;padding:4px;line-height:1}
.star.on{color:var(--rust)}.star.off{color:var(--ink3);opacity:.4}

/* Key points */
.kp{margin:8px 0}
.kp ul{margin:6px 0 0 16px}
.kp li{margin-bottom:4px;font-size:13px;color:var(--ink2);line-height:1.5}

/* Markdown in modal */
.md{margin-top:10px;border-top:1px solid var(--border);padding-top:12px}
.md h2{font-size:14px;color:var(--rust);margin:12px 0 6px}
.md p{margin-bottom:6px;font-size:13px;color:var(--ink2);line-height:1.5}
.md code{font-family:var(--ffm);font-size:10px;background:var(--border);padding:1px 4px;border-radius:3px}
.md ul{margin:0 0 6px 16px}
.md li{font-size:13px;color:var(--ink2)}
.md blockquote{border-left:2px solid rgba(181,80,47,.15);padding-left:10px;margin:6px 0;font-size:13px;color:var(--ink2);font-style:italic}
.md-l{text-align:center;padding:16px;font-size:13px;color:var(--ink3)}

/* Notes */
.nts{margin-top:10px;border-top:1px solid var(--border);padding-top:12px}
.nts textarea{width:100%;min-height:70px;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:8px;font-size:13px;resize:vertical;outline:none;font-family:var(--ff)}
.nts textarea:focus{border-color:var(--rust)}

/* Sub-header */
.sh{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:16px 0 6px}
.sh:first-of-type{margin-top:4px}

/* Focus */
:focus-visible{outline:2px solid var(--rust);outline-offset:2px;border-radius:4px}

/* Responsive */
@media(max-width:480px){
  #content{padding:10px;padding-bottom:100px}
  .card{padding:14px}
  .sc{flex-direction:column}
  .si{width:100%}.fs{width:100%}
  nav{padding:0 6px;height:44px}
  .nav-tab{font-size:10px}
}
</style>
</head>
<body>

<nav>
  <span class="nav-logo">Destillo</span>
  <button class="nav-tab active" data-t="capture">Capture</button>
  <button class="nav-tab" data-t="library">Library</button>
  <button class="nav-tab" data-t="browse">Tags</button>
  <button class="nav-tab" data-t="settings">Settings</button>
</nav>

<div id="content">

<div class="tab active" id="t-capture">
  <div class="card">
    <div class="card-h">New Capture</div>
    <div class="ur">
      <input class="ui" id="url-i" placeholder="YouTube URL" />
      <button class="sb" id="sub-btn" onclick="sub()">Queue →</button>
    </div>
    <input class="sel" id="area-cap" list="al" placeholder="Subject area" />
    <datalist id="al"></datalist>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row"><span class="st-l">Total</span><span class="st-v" id="s-t">—</span></div>
    <div class="row"><span class="st-l">Queued</span><span class="st-v" id="s-q">—</span></div>
    <div class="row"><span class="st-l">Errors</span><span class="st-v" id="s-e">—</span></div>
  </div>
  <div class="sh">Recent</div>
  <div class="card" id="recent-l" style="padding:8px 14px"></div>
</div>

<div class="tab" id="t-library">
  <div class="sc">
    <input class="si" id="lib-s" placeholder="Search…" />
    <select class="fs" id="lib-a" style="flex-shrink:0"><option value="">All areas</option></select>
    <select class="fs" id="lib-f" style="flex-shrink:0"><option value="">All</option><option value="1">Fav</option><option value="0">No fav</option></select>
  </div>
  <div id="lib-l"></div>
  <button class="lm" id="lm" style="display:none" onclick="loadLib()">Load more</button>
</div>

<div class="tab" id="t-browse">
  <div class="sh">Tags</div>
  <div class="tc" id="tag-c"></div>
  <div class="sh">Channels</div>
  <div class="card" id="chan-l" style="padding:4px 14px"></div>
</div>

<div class="tab" id="t-settings">
  <div class="sh">LLM</div>
  <div class="card" style="padding:8px 14px">
    <div class="sr"><span class="sl">Provider</span><select class="sv" id="c-p" onchange="tp()"><option value="local">Local</option><option value="anthropic">Anthropic</option></select></div>
    <div id="lf"><div class="sr"><span class="sl">URL</span><input class="sv" id="c-u" /></div><div class="sr"><span class="sl">Model</span><input class="sv" id="c-m" /></div></div>
    <div id="af" style="display:none"><div class="sr"><span class="sl">Key</span><input class="sv" id="c-k" type="password" /></div></div>
  </div>
  <div class="sh">Storage</div>
  <div class="card" style="padding:8px 14px">
    <div class="sr"><span class="sl">Path</span><input class="sv" id="c-pth" /></div>
    <div class="sr"><span class="sl">Def area</span><input class="sv" id="c-da" /></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn btn-r" onclick="saveSet()" style="flex:1">Save</button>
  </div>
</div>

</div><!-- /content -->

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Bulk bar -->
<div id="bulk">
  <span class="bc"><span id="bc">0</span> selected</span>
  <select class="ba" id="bulk-a"><option value="">Area</option></select>
  <button class="bp" id="bulk-ap">Apply</button>
  <button class="bx" id="bulk-cx">Cancel</button>
</div>

<script>
let cfg = {}, off = 0, sel = new Set(), st, mi = null, ta = null, ca = null;
let kas = [];

/* Nav */
document.querySelectorAll('.nav-tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const t = b.dataset.t;
  document.getElementById('t-'+t).classList.add('active');
  if(t==='library') loadLib(1);
  if(t==='browse') loadBr();
  if(t==='settings') loadSet();
}));

/* Toast */
let tt;
function t(m, e){
  const el = document.getElementById('toast');
  el.textContent = m; el.className = 'toast s';
  clearTimeout(tt); tt = setTimeout(() => el.className='toast', 3000);
}

/* Helpers */
function ago(d){
  if(!d) return '—';
  const s = (Date.now()-new Date(d))/1000;
  if(s<60) return 'now'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}
function ab(a){return a?'<span class="b b-a">'+a+'</span>':''}
function sb(s){const c=s||'m';return '<span class="b b-'+c+'">'+(s||'manual')+'</span>'}
function tg(t){return Array.isArray(t)?t.map(x=>'<span class="t">'+x+'</span>').join(''):''}
function dd(s){return '<span class="d d-'+s+'"></span>'}

/* Capture */
document.getElementById('url-i').addEventListener('keydown', e => { if(e.key==='Enter') sub(); });

async function sub(){
  const url = document.getElementById('url-i').value.trim();
  const area = document.getElementById('area-cap').value;
  if(!url){t('Paste a URL','err');return}
  const btn = document.getElementById('sub-btn');
  btn.disabled=true; btn.textContent='...';
  try {
    const r = await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,subject_area:area||null})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail||'Err');
    document.getElementById('url-i').value='';
    t('Queued ✓');
    loadStats(); loadR();
  } catch(e){t(e.message,'err');}
  finally{btn.disabled=false;btn.textContent='Queue →'}
}

async function loadStats(){
  try {
    const [st, sv] = await Promise.all([fetch('/api/stats').then(r=>r.json()), fetch('/api/status').then(r=>r.json())]);
    document.getElementById('s-t').textContent = st.total;
    document.getElementById('s-q').textContent = (st.queued||0)+(st.processing||0);
    document.getElementById('s-e').textContent = st.errors;
    const das = (st.by_subject_area||[]).map(a=>a.subject_area).filter(Boolean);
    const cas = (cfg.subject_areas||[]).map(a=>a.name).filter(Boolean);
    kas = [...new Set([...das,...cas])].sort();
    fillDd();
  } catch(e){}
}

function fillDd(){
  const o = kas.map(a=>'<option value="'+a+'"></option>').join('');
  const dl = document.getElementById('al');
  if(dl) dl.innerHTML = o;
  const co = kas.map(a=>'<option value="'+a+'">'+a+'</option>').join('');
  const ac = document.getElementById('area-cap');
  if(ac) ac.innerHTML = '<option value="">Auto area</option>'+co;
  [['lib-a','All areas'],['bulk-a','Area']].forEach(([id,ph]) => {
    const el = document.getElementById(id);
    if(!el) return;
    const cv = el.value;
    el.innerHTML = '<option value="">'+ph+'</option>'+co;
    el.value = cv;
  });
}

async function loadR(){
  try {
    const d = await fetch('/api/library?limit=5&include_active=1').then(r=>r.json());
    const items = d.items||[];
    document.getElementById('recent-l').innerHTML = items.length ? items.map(i => {
      const tags = Array.isArray(i.tags)?i.tags:[];
      return '<div class="li" onclick="oM('+i.id+')">'+dd(i.status)+
        '<div class="li-c"><div class="li-t">'+(i.title||i.url)+'</div>'+
        '<div class="li-m">'+(i.channel?i.channel:'')+(i.channel&&i.processed_at?' · ':'')+(i.processed_at?ago(i.processed_at):'')+
        ' '+ab(i.subject_area)+sb(i.source)+'</div>'+
        (i.summary?'<div class="li-s">'+i.summary+'</div>':'')+
        (tags.length?'<div class="tg">'+tg(tags)+'</div>':'')+'</div></div>';
    }).join('') : '<div class="e"><div class="e-i">🕳️</div><div class="e-t">Nothing yet</div><div class="e-s">Paste a YouTube link to start</div></div>';
  } catch(e){}
}

/* Library */
async function loadLib(r){
  if(r){off=0;document.getElementById('lib-l').innerHTML=''}
  const s = document.getElementById('lib-s').value.trim();
  const a = document.getElementById('lib-a').value;
  const f = document.getElementById('lib-f').value;
  const p = new URLSearchParams({limit:20,offset:off,...(s&&{search:s}),...(a&&{subject_area:a}),...(f&&{favorite:f}),
    ...(ta&&{tag:ta}),...(ca&&{channel:ca})});
  try {
    const d = await fetch('/api/library?'+p).then(r=>r.json());
    const items = d.items||[];
    if(!items.length && off===0){
      document.getElementById('lib-l').innerHTML = '<div class="e"><div class="e-i">📭</div><div class="e-t">Nothing here</div><div class="e-s">No entries match</div></div>';
      document.getElementById('lm').style.display='none'; return;
    }
    document.getElementById('lib-l').innerHTML += items.map(i => {
      const tags = Array.isArray(i.tags)?i.tags:[];
      const se = sel.has(i.id)?'style="background:rgba(181,80,47,.08)"':'';
      return '<div class="li" id="lc-'+i.id+'" '+se+
        ' onclick="oM('+i.id+')">'+
        dd(i.status)+
        '<div class="li-c"><div class="li-t">'+(i.title||i.url)+'</div>'+
        '<div class="li-m">'+(i.channel?i.channel:'')+(i.channel&&i.processed_at?' · ':'')+(i.processed_at?ago(i.processed_at):'')+'</div>'+
        (i.summary?'<div class="li-s">'+i.summary+'</div>':'')+
        (tags.length?'<div class="tg">'+tg(tags)+'</div>':'')+'</div>'+
        '<div style="flex-shrink:0;display:flex;align-items:center;gap:4px">'+
        '<button class="star '+(i.favorite?'on':'off')+'" onclick="event.stopPropagation();ts('+i.id+')">'+(i.favorite?'★':'☆')+'</button>'+
        ab(i.subject_area)+sb(i.source)+'</div></div>';
    }).join('');
    off += items.length;
    document.getElementById('lm').style.display = items.length===20 ? 'block' : 'none';
    const af = document.getElementById('act-f');
    if(ta||ca){
      if(af) af.style.display='flex';
    } else if(af) af.style.display='none';
  } catch(e){}
}

function ds(){clearTimeout(st);st=setTimeout(()=>loadLib(1),280)}

/* Browse */
async function loadBr(){
  try {
    const [td, cd] = await Promise.all([fetch('/api/tags').then(r=>r.json()),fetch('/api/channels').then(r=>r.json())]);
    const tags = td.tags||[], chs = cd.channels||[];
    document.getElementById('tag-c').innerHTML = tags.length ? tags.map(t => {
      const max = Math.max(...tags.map(x=>x.count),1);
      const r = t.count/max;
      const sz = r>.66?'font-size:13px':r>.33?'font-size:12px':'font-size:10px';
      return '<span class="tci" style="'+sz+'" onclick="fT(\''+t.tag.replace(/'/g,"\\'")+'\')">'+t.tag+' <span style="color:var(--ink3)">'+t.count+'</span></span>';
    }).join('') : '<div class="e"><div class="e-i">🏷️</div><div class="e-t">No tags yet</div></div>';
    document.getElementById('chan-l').innerHTML = chs.length ? chs.map(c =>
      '<div class="ch" onclick="fC(\''+c.channel.replace(/'/g,"\\'")+'\')"><span>📺</span><span class="ch-n">'+c.channel+'</span><span class="ch-c">'+c.count+'</span></div>'
    ).join('') : '<div class="e"><div class="e-i">📺</div><div class="e-t">No channels yet</div></div>';
  } catch(e){}
}

function fT(t){ta=t;ca=null;switchT('library');document.getElementById('lib-s').value='';loadLib(1);t('tag: '+t)}
function fC(c){ca=c;ta=null;switchT('library');document.getElementById('lib-s').value='';loadLib(1);t('channel: '+c)}
function switchT(n){
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
  document.querySelector('.nav-tab[data-t="'+n+'"]').classList.add('active');
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('t-'+n).classList.add('active');
}

/* Modal */
mi = null;
function oM(id) {
  // Create a floating detail panel
  const existing = document.getElementById('detail-panel');
  if (existing) existing.remove();
  
  fetch('/api/library/'+id).then(r=>r.json()).then(item => {
    mi = item;
    const tags = Array.isArray(item.tags)?item.tags:[];
    
    const panel = document.createElement('div');
    panel.id = 'detail-panel';
    panel.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;touch-action:none';
    
    const sheet = document.createElement('div');
    sheet.style.cssText = 'background:var(--card);width:100%;max-width:600px;max-height:85vh;border-radius:12px 12px 0 0;display:flex;flex-direction:column;overscroll-behavior:contain';
    // Add slide-up animation to head
    if(!document.getElementById('sheet-anim')){
      const st = document.createElement('style');
      st.id = 'sheet-anim';
      st.textContent = '@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}';
      document.head.appendChild(st);
    }
    sheet.style.animation = 'slideUp .3s ease';
    
    // Head
    sheet.innerHTML += '<div style="padding:14px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px">'+
      '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(item.title||item.url)+'</div>'+
      '<div style="font-family:var(--ffm);font-size:10px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
      (item.channel?'📺 '+item.channel:'')+(item.channel&&item.processed_at?' · ':'')+(item.processed_at?new Date(item.processed_at).toLocaleDateString():'')+'</div></div>'+
      '<button onclick="cM()" style="width:32px;height:32px;border-radius:50%;border:none;background:var(--border);font-size:16px;cursor:pointer;flex-shrink:0">✕</button></div>';
    
    // Body — everything scrollable goes inside this div
    sheet.innerHTML += '<div style="flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y">'+
      '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">'+ab(item.subject_area)+sb(item.source)+
      '<button class="star '+(item.favorite?'on':'off')+'" onclick="ts('+item.id+')" style="margin-left:auto;font-size:18px">'+(item.favorite?'★':'☆')+'</button></div>'+
      '<div style="font-size:13px;color:var(--ink2);margin-bottom:8px;word-break:break-word">'+(item.summary||'No summary')+'</div>'+
      '<div id="kp-'+item.id+'"></div>'+
      '<div id="md-'+item.id+'" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;text-align:left">Loading transcript…</div>'+
      '<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">'+
        '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:4px">Notes</div>'+
        '<textarea id="ne-'+item.id+'" style="width:100%;min-height:60px;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:8px;font-size:13px;resize:vertical;outline:none;font-family:var(--ff)" placeholder="Add notes…"></textarea>'+
        '<div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-r" style="min-height:36px;padding:6px 14px;font-size:12px" onclick="svN('+item.id+')">Save Notes</button>'+
        '<span id="ns-'+item.id+'" style="display:none;font-size:12px;color:var(--olive);align-self:center">✓</span></div></div></div>';
    
    // Footer
    sheet.innerHTML += '<div style="padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:6px;flex-wrap:wrap">'+
      (item.file_path?'<a href="/api/library/'+item.id+'/file" target="_blank" class="btn btn-r" style="min-height:36px;padding:6px 14px;font-size:12px">Full Transcript ↗</a>':'')+
      (item.status==='error'?'<button class="btn btn-g" style="min-height:36px;padding:6px 12px;font-size:12px" onclick="rt('+item.id+')">Retry</button>':'')+
      '<button class="btn btn-red" style="min-height:36px;padding:6px 12px;font-size:12px" onclick="dl('+item.id+')">Remove</button></div>';
    
    panel.appendChild(sheet);
    document.body.appendChild(panel);
    document.body.style.overflow = 'hidden';
    document.body.style.position = 'fixed';
    document.body.style.width = '100%';
    
    // Load key points
    fetch('/api/library/'+item.id+'/keypoints').then(r=>r.json()).then(d => {
      const kp = d.key_points||[];
      if(kp.length){
        document.getElementById('kp-'+item.id).innerHTML = '<div style="margin:4px 0"><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:4px">Key Points</div><ul>'+
          kp.map(p => '<li style="margin-bottom:4px;font-size:13px;color:var(--ink2);line-height:1.5">'+p+'</li>').join('')+'</ul></div>';
      }
    }).catch(()=>{});
    
    // Load markdown
    if(item.file_path){
      fetch('/api/library/'+item.id+'/file').then(r=>r.text()).then(md => {
        const el = document.getElementById('md-'+item.id);
        if(el) el.innerHTML = marked.parse(md);
      }).catch(()=>{const el=document.getElementById('md-'+item.id);if(el)el.textContent='Could not load transcript.';});
    } else {
      const el = document.getElementById('md-'+item.id);
      if(el) el.textContent = item.status==='error' ? 'Processing failed — no transcript available.' : 'Transcript not available yet — still processing.';
    }
    
    // Load notes
    loadNotes(item.id);
    
  }).catch(e => {t('Error: '+e.message,'err')});
}

function cM(){
  const p = document.getElementById('detail-panel');
  if(p) p.remove();
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  mi = null;
}

async function loadNotes(id){
  try {
    const r = await fetch('/api/library/'+id+'/notes');
    const d = await r.json();
    const el = document.getElementById('ne-'+id);
    if(el && d.notes) el.value = d.notes;
  } catch(e){}
}

async function svN(id){
  const el = document.getElementById('ne-'+id);
  if(!el) return;
  await fetch('/api/library/'+id+'/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes:el.value})});
  document.getElementById('ns-'+id).style.display='inline';
  setTimeout(()=>{const e=document.getElementById('ns-'+id);if(e)e.style.display='none'},2000);
}

async function ts(id){
  try {
    const r = await fetch('/api/library/'+id+'/favorite',{method:'POST'});
    const d = await r.json();
    if(d.ok){
      const stars = document.querySelectorAll('#lc-'+id+' .star, #detail-panel .star');
      stars.forEach(s => { s.innerHTML = d.favorite?'★':'☆'; s.className = 'star '+(d.favorite?'on':'off'); });
      t(d.favorite?'Faved ✓':'Unfaved');
    }
  } catch(e){}
}

async function rt(id){
  await fetch('/api/library/'+id+'/retry',{method:'POST'});
  t('Retry queued');
  loadStats(); loadR();
}

async function dl(id){
  if(!confirm('Delete?')) return;
  await fetch('/api/library/'+id,{method:'DELETE'});
  cM(); t('Deleted');
  loadStats(); loadR();
  if(document.getElementById('t-library').classList.contains('active')) loadLib(1);
}

/* Settings */
async function loadSet(){
  try {
    cfg = await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());
    document.getElementById('c-p').value = cfg.llm_provider||'local';
    document.getElementById('c-u').value = cfg.local_llm_url||'';
    document.getElementById('c-m').value = cfg.local_llm_model||'';
    document.getElementById('c-k').value = cfg.anthropic_api_key||'';
    document.getElementById('c-pth').value = cfg.default_storage_path||'';
    document.getElementById('c-da').value = cfg.default_subject_area||'';
    tp();
  } catch(e){}
}
function tp(){
  const l = document.getElementById('c-p').value==='local';
  document.getElementById('lf').style.display = l?'':'none';
  document.getElementById('af').style.display = l?'none':'';
}
async function saveSet(){
  const nc = {
    llm_provider: document.getElementById('c-p').value,
    local_llm_url: document.getElementById('c-u').value.trim(),
    local_llm_model: document.getElementById('c-m').value.trim(),
    anthropic_api_key: document.getElementById('c-k').value.trim(),
    default_storage_path: document.getElementById('c-pth').value.trim(),
    default_subject_area: document.getElementById('c-da').value.trim(),
    subject_areas: [],
  };
  try {
    const r = await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(nc)});
    if(!r.ok) throw new Error('Failed');
    cfg = nc; t('Saved ✓');
  } catch(e){t('Error: '+e.message,'err');}
}

/* Bulk bar */
document.getElementById('bulk-cx').addEventListener('click', () => { sel.clear(); document.getElementById('bulk').classList.remove('s'); });
document.getElementById('bulk-ap').addEventListener('click', applyBulk);

async function applyBulk(){
  if(!sel.size){t('Select items','err');return}
  const a = document.getElementById('bulk-a').value;
  const ids = [...sel];
  let done = 0;
  for(const id of ids){
    try {
      await fetch('/api/library/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject_area:a||null})});
      done++;
    } catch(e){}
  }
  t('Updated '+done+' items');
  sel.clear(); document.getElementById('bulk').classList.remove('s');
  loadLib(1); loadStats();
}

/* Init */
async function init(){
  try { cfg = await fetch('/api/config',{cache:'no-store'}).then(r=>r.json()); } catch(_){}
  fillDd(); loadStats(); loadR();
  setInterval(() => { loadStats(); if(document.querySelector('.nav-tab.active')?.dataset.t==='capture') loadR(); }, 28000);
}
init();
</script>
